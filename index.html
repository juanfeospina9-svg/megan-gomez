<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>Meghan Gomez</title>

    <meta
        name="description"
        content="Meghan Gomez — Exclusive Content"
    >

    <style>

        /* =========================================
           RESET
        ========================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        /* =========================================
           PAGE
        ========================================= */

        html,
        body {
            width: 100%;
            height: 100%;
            background: #080808;
        }

        body {
            font-family:
                Arial,
                Helvetica,
                sans-serif;

            overflow: hidden;
        }


        .page {
            position: relative;

            width: 100%;
            height: 100svh;
            min-height: 100svh;

            overflow: hidden;

            background: #080808;
        }


        /* =========================================
           HERO IMAGE
        ========================================= */

        .hero-image {
            position: absolute;
            inset: 0;

            width: 100%;
            height: 100%;

            background-image: url("IMG_4372.jpg");

            background-size: cover;

            background-position: center center;

            background-repeat: no-repeat;

            transform: scale(1.01);
        }


        /* =========================================
           IMAGE OVERLAY
        ========================================= */

        .overlay {
            position: absolute;
            inset: 0;

            background:
                linear-gradient(
                    to bottom,
                    rgba(0, 0, 0, 0.04) 0%,
                    rgba(0, 0, 0, 0.02) 38%,
                    rgba(0, 0, 0, 0.14) 58%,
                    rgba(0, 0, 0, 0.52) 78%,
                    rgba(0, 0, 0, 0.90) 100%
                );
        }


        /* =========================================
           CONTENT
        ========================================= */

        .content {
            position: relative;
            z-index: 2;

            width: 100%;
            height: 100%;

            display: flex;
            flex-direction: column;
            justify-content: flex-end;

            padding:
                0
                20px
                calc(24px + env(safe-area-inset-bottom));
        }


        /* =========================================
           IDENTITY
        ========================================= */

        .identity {
            text-align: center;

            margin-bottom: 22px;
        }


        .name {
            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: clamp(40px, 11vw, 58px);

            line-height: 0.92;

            font-weight: 700;

            letter-spacing: 0.045em;

            text-transform: uppercase;

            color: #ffffff;

            text-shadow:
                0 3px 20px rgba(0, 0, 0, 0.55);
        }


        .handle {
            margin-top: 12px;

            font-size: 11px;

            font-weight: 400;

            letter-spacing: 0.28em;

            color: rgba(255, 255, 255, 0.78);

            text-transform: uppercase;
        }


        /* =========================================
           EXCLUSIVE CONTENT BUTTON
        ========================================= */

        .exclusive-button {

            width: 100%;
            height: 58px;

            display: flex;

            align-items: center;
            justify-content: center;

            gap: 13px;

            border: 1px solid rgba(255, 255, 255, 0.68);

            background: rgba(8, 8, 8, 0.78);

            color: #ffffff;

            text-decoration: none;

            font-size: 11px;

            font-weight: 600;

            letter-spacing: 0.28em;

            text-transform: uppercase;

            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);

            box-shadow:
                0 8px 30px rgba(0, 0, 0, 0.22);

            transition:
                background 0.25s ease,
                transform 0.2s ease,
                border-color 0.25s ease;
        }


        .exclusive-button:hover {

            background: rgba(255, 255, 255, 0.12);

            border-color: #ffffff;
        }


        .exclusive-button:active {

            transform: scale(0.985);
        }


        /* =========================================
           MINIMAL LOCK ICON
        ========================================= */

        .lock {

            width: 15px;
            height: 15px;

            display: inline-block;

            position: relative;
        }


        .lock::before {

            content: "";

            position: absolute;

            left: 2px;
            bottom: 0;

            width: 11px;
            height: 9px;

            border: 1.5px solid #ffffff;

            border-radius: 1px;
        }


        .lock::after {

            content: "";

            position: absolute;

            left: 4px;
            top: 0;

            width: 7px;
            height: 7px;

            border:
                1.5px solid #ffffff;

            border-bottom: none;

            border-radius:
                5px 5px 0 0;
        }


        /* =========================================
           CLEAN ARROW
        ========================================= */

        .arrow {

            display: inline-flex;

            align-items: center;
            justify-content: center;

            width: 15px;
            height: 15px;

            font-size: 17px;

            font-weight: 300;

            line-height: 1;

            color: #ffffff;
        }


        /* =========================================
           PROFESSIONAL FOOTER
        ========================================= */

        .footer {

            margin-top: 18px;

            text-align: center;

            font-size: 8px;

            line-height: 1.6;

            letter-spacing: 0.18em;

            text-transform: uppercase;

            color: rgba(255, 255, 255, 0.42);
        }


        .footer .copyright {

            display: block;
        }


        .footer .website-credit {

            display: block;

            margin-top: 3px;

            color: rgba(255, 255, 255, 0.28);

            font-size: 7px;

            letter-spacing: 0.16em;
        }


        /* =========================================
           SMALL PHONES
        ========================================= */

        @media (max-height: 700px) {

            .content {

                padding-bottom:
                    calc(18px + env(safe-area-inset-bottom));
            }


            .identity {

                margin-bottom: 17px;
            }


            .name {

                font-size: 38px;
            }


            .handle {

                margin-top: 8px;
            }


            .exclusive-button {

                height: 54px;
            }


            .footer {

                margin-top: 12px;
            }
        }


        /* =========================================
           DESKTOP PREVIEW
        ========================================= */

        @media (min-width: 700px) {

            body {

                display: flex;

                justify-content: center;

                background: #050505;
            }


            .page {

                width: 480px;

                max-width: 480px;

                box-shadow:
                    0 0 80px rgba(0, 0, 0, 0.65);
            }
        }

    </style>

</head>


<body>

    <main class="page">


        <!-- MAIN IMAGE -->

        <div class="hero-image"></div>


        <!-- DARK GRADIENT -->

        <div class="overlay"></div>


        <!-- MAIN CONTENT -->

        <div class="content">


            <!-- NAME + INSTAGRAM -->

            <div class="identity">

                <h1 class="name">
                    Meghan Gomez
                </h1>

                <div class="handle">
                    @_meghan_gomez1
                </div>

            </div>


            <!-- ONLYFANS CTA -->

            <a
                href="https://onlyfans.com/meghan_gomez"
                class="exclusive-button"
                id="onlyfansButton"
            >

                <span class="lock"></span>

                <span>
                    Exclusive Content
                </span>

                <span class="arrow">
                    ↗
                </span>

            </a>


            <!-- PROFESSIONAL FOOTER -->

            <footer class="footer">

                <span class="copyright">
                    © 2026 MeghanGomez.com · All Rights Reserved
                </span>

                <span class="website-credit">
                    Official Website
                </span>

            </footer>


        </div>

    </main>

</body>

</html>
