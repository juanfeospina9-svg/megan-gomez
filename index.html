<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>Meghan Gomez</title>

    <meta
        name="description"
        content="Meghan Gomez — Exclusive Content"
    >

    <style>

        /* =========================================
           RESET
        ========================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        /* =========================================
           BASE
        ========================================= */

        html,
        body {
            width: 100%;
            height: 100%;
            background: #080808;
        }

        body {
            font-family:
                Arial,
                Helvetica,
                sans-serif;

            overflow: hidden;
        }


        /* =========================================
           MAIN PAGE
        ========================================= */

        .page {
            position: relative;

            width: 100%;
            height: 100svh;
            min-height: 100svh;

            overflow: hidden;

            background: #080808;
        }


        /* =========================================
           HERO IMAGE
        ========================================= */

        .hero-image {
            position: absolute;
            inset: 0;

            width: 100%;
            height: 100%;

            background-image: url("IMG_5926%203.jpg");

            background-size: cover;

            background-position: center center;

            background-repeat: no-repeat;

            transform: scale(1.01);
        }


        /* =========================================
           IMAGE GRADIENT
        ========================================= */

        .overlay {
            position: absolute;
            inset: 0;

            background:
                linear-gradient(
                    to bottom,
                    rgba(0, 0, 0, 0.02) 0%,
                    rgba(0, 0, 0, 0.02) 35%,
                    rgba(0, 0, 0, 0.10) 55%,
                    rgba(0, 0, 0, 0.48) 75%,
                    rgba(0, 0, 0, 0.90) 100%
                );
        }


        /* =========================================
           CONTENT
        ========================================= */

        .content {
            position: relative;

            z-index: 2;

            width: 100%;
            height: 100%;

            display: flex;

            flex-direction: column;

            justify-content: flex-end;

            padding:
                0
                20px
                calc(24px + env(safe-area-inset-bottom));
        }


        /* =========================================
           IDENTITY
        ========================================= */

        .identity {
            width: 100%;

            text-align: center;

            margin-bottom: 22px;
        }


        /* =========================================
           NAME
        ========================================= */

        .name {
            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size:
                clamp(40px, 11vw, 58px);

            line-height: 0.92;

            font-weight: 700;

            letter-spacing: 0.045em;

            text-transform: uppercase;

            color: #ffffff;

            text-shadow:
                0 2px 2px rgba(0, 0, 0, 0.35),
                0 5px 14px rgba(0, 0, 0, 0.55),
                0 10px 28px rgba(0, 0, 0, 0.30);
        }


        /* =========================================
           INSTAGRAM HANDLE
        ========================================= */

        .handle {
            margin-top: 12px;

            font-size: 11px;

            font-weight: 400;

            letter-spacing: 0.28em;

            color:
                rgba(255, 255, 255, 0.80);

            text-transform: uppercase;

            text-shadow:
                0 2px 8px rgba(0, 0, 0, 0.55);
        }


        /* =========================================
           EXCLUSIVE CONTENT BUTTON
        ========================================= */

        .exclusive-button {

            position: relative;

            width: 100%;

            height: 58px;
            
            overflow: hidden;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 13px;

            border:
                1px solid
                rgba(255, 255, 255, 0.72);

            background:
                rgba(8, 8, 8, 0.78);

            color: #ffffff;

            text-decoration: none;

            font-size: 11px;

            font-weight: 600;

            letter-spacing: 0.28em;

            text-transform: uppercase;

            backdrop-filter: blur(12px);

            -webkit-backdrop-filter: blur(12px);

            box-shadow:
                0 8px 30px
                rgba(0, 0, 0, 0.28);

            animation:
                buttonPulse 2s
                ease-in-out
                infinite;

            transition:
                background 0.25s ease,
                transform 0.2s ease,
                border-color 0.25s ease;
        }

        /* =========================================
   SUBTLE LIGHT SWEEP
========================================= */

.exclusive-button::before {
    content: "";

    position: absolute;

    top: 0;
    left: -70%;

    width: 35%;
    height: 100%;

    background:
        linear-gradient(
            90deg,
            transparent 0%,
            rgba(255, 255, 255, 0.04) 25%,
            rgba(255, 255, 255, 0.65) 50%,
            rgba(255, 255, 255, 0.04) 75%,
            transparent 100%
        );

    transform: skewX(-20deg);

    animation:
        lightSweep 4.5s
        ease-in-out
        infinite;

    pointer-events: none;

    z-index: 1;
}


@keyframes lightSweep {

    0% {
        left: -70%;
    }

    18% {
        left: 120%;
    }

    100% {
        left: 120%;
    }
}

        /* Keep button content above the light */

        .exclusive-button span {
    position: relative;
    z-index: 2;
}


        /* =========================================
           BUTTON ANIMATION
        ========================================= */

        @keyframes buttonPulse {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-3px);
            }
        }


        .exclusive-button:hover {

            background:
                rgba(255, 255, 255, 0.12);

            border-color: #ffffff;
        }


        .exclusive-button:active {

            transform:
                scale(0.985);
        }


/* =========================================
   REAL LOCK ICON — SMALL
========================================= */

.lock {
    position: relative;

    width: 9px;
    height: 10px;

    display: inline-block;

    flex-shrink: 0;

}


/* Lock shackle */

.lock::before {
    content: "";

    position: absolute;

    left: 1.5px;
    top: -1px;

    width: 6px;
    height: 6px;

    border:
        1.2px solid #ffffff;

    border-bottom: none;

    border-radius:
        5px 5px 0 0;

    z-index: 1;
}


/* Lock body */

.lock::after {
    content: "";

    position: absolute;

    left: 0;
    top: 3px;

    width: 9px;
    height: 6px;

    background: rgba(8, 8, 8, 0.96);

    border:
        1.2px solid #ffffff;

    border-radius: 1.5px;

    z-index: 2;
}


/* Keyhole */

.keyhole {
    position: absolute;

    left: 50%;
    top: 4.5px;

    width: 2px;
    height: 2px;

    transform:
        translateX(-50%);

    background: #ffffff;

    border-radius: 50%;

    z-index: 3;
}


.keyhole::after {
    content: "";

    position: absolute;

    left: 50%;
    top: 1.5px;

    width: 1px;
    height: 2px;

    transform:
        translateX(-50%);

    background: #ffffff;
}

        /* =========================================
           FOOTER
        ========================================= */

        .footer {

            margin-top: 18px;

            text-align: center;

            font-size: 8px;

            line-height: 1.6;

            letter-spacing: 0.18em;

            text-transform: uppercase;

            color:
                rgba(255, 255, 255, 0.42);

            text-shadow:
                0 1px 5px
                rgba(0, 0, 0, 0.5);
        }


        .copyright {

            display: block;
        }


        .website-credit {

            display: block;

            margin-top: 3px;

            font-size: 7px;

            letter-spacing: 0.16em;

            color:
                rgba(255, 255, 255, 0.27);
        }


        /* =========================================
           SMALL PHONES
        ========================================= */

        @media (max-height: 700px) {

            .content {

                padding-bottom:
                    calc(
                        18px
                        +
                        env(safe-area-inset-bottom)
                    );
            }


            .identity {

                margin-bottom: 17px;
            }


            .name {

                font-size: 38px;
            }


            .handle {

                margin-top: 8px;
            }


            .exclusive-button {

                height: 54px;
            }


            .footer {

                margin-top: 12px;
            }
        }


        /* =========================================
           DESKTOP PREVIEW
        ========================================= */

        @media (min-width: 700px) {

            body {

                display: flex;

                justify-content: center;

                background: #050505;
            }


            .page {

                width: 480px;

                max-width: 480px;

                box-shadow:
                    0 0 80px
                    rgba(0, 0, 0, 0.65);
            }
        }

    </style>

</head>


<body>

    <main class="page">


        <!-- MAIN PHOTO -->

        <div class="hero-image"></div>


        <!-- DARK GRADIENT -->

        <div class="overlay"></div>


        <!-- MAIN CONTENT -->

        <div class="content">


            <!-- NAME + INSTAGRAM -->

            <div class="identity">

                <h1 class="name">
                    Meghan<br>
                    Gomez
                </h1>

                <div class="handle">
                    @_meghan_gomez1_
                </div>

            </div>


            <!-- ONLYFANS CTA -->

            <a
                href="https://go.meghangomez.com/exclusive"
                class="exclusive-button"
                id="onlyfansButton"
            >

                <span class="lock">
                    <span class="keyhole"></span>
                </span>

                <span>
                    Exclusive Content
                </span>

            </a>


            <!-- PROFESSIONAL FOOTER -->

            <footer class="footer">

                <span class="copyright">
                    © 2026 MeghanGomez.com · All Rights Reserved
                </span>

                <span class="website-credit">
                    Official Website
                </span>

            </footer>


        </div>

    </main>

        <!-- Cloudflare Web Analytics -->
    <script
        type="module"
        src="https://static.cloudflareinsights.com/beacon.min.js"
        data-cf-beacon='{"token": "540f5a5083054195bcd1905015840e1a"}'>
    </script>
    <!-- End Cloudflare Web Analytics -->

    <!-- 18+ AGE GATE -->
<div class="age-gate" id="ageGate">
    <div class="age-gate-card">
        <div class="age-gate-title">18+ ONLY</div>

        <div class="age-gate-text">
            This content is intended for adults 18 years and older.
        </div>

        <div class="age-gate-actions">
            <button class="age-gate-confirm" id="ageGateConfirm">
                I'M 18+
            </button>

            <button class="age-gate-back" id="ageGateBack">
                GO BACK
            </button>
        </div>
    </div>
</div>

<style>
    .age-gate {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: rgba(0, 0, 0, 0.72);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transition:
            opacity 0.25s ease,
            visibility 0.25s ease;
        z-index: 100;
    }

    .age-gate.active {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
    }

    .age-gate-card {
        width: min(100%, 340px);
        padding: 30px 24px 24px;
        text-align: center;
        background: rgba(12, 12, 12, 0.94);
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow:
            0 20px 60px rgba(0, 0, 0, 0.55);
    }

    .age-gate-title {
        margin-bottom: 12px;
        font-family:
            Georgia,
            "Times New Roman",
            serif;
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 0.12em;
        color: #ffffff;
    }

    .age-gate-text {
        margin-bottom: 24px;
        font-family:
            Arial,
            Helvetica,
            sans-serif;
        font-size: 12px;
        line-height: 1.6;
        color: rgba(255, 255, 255, 0.68);
    }

    .age-gate-actions {
        display: flex;
        flex-direction: column;
        gap: 10px;
    }

    .age-gate-confirm,
    .age-gate-back {
        width: 100%;
        min-height: 44px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        font-family:
            Arial,
            Helvetica,
            sans-serif;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.12em;
        cursor: pointer;
    }

    .age-gate-confirm {
        background: rgba(255, 255, 255, 0.94);
        color: #080808;
    }

    .age-gate-back {
        background: transparent;
        color: rgba(255, 255, 255, 0.68);
    }
</style>

<script>
    const onlyfansButton =
        document.getElementById("onlyfansButton");

    const ageGate =
        document.getElementById("ageGate");

    const ageGateConfirm =
        document.getElementById("ageGateConfirm");

    const ageGateBack =
        document.getElementById("ageGateBack");

    onlyfansButton.addEventListener("click", function (event) {
    event.preventDefault();

    const ageGateUrl =
        "https://meghangomez.com/18plus.html";

    const userAgent =
        navigator.userAgent ||
        navigator.vendor ||
        window.opera;

    // iPhone / iPad
    if (/iPhone|iPad|iPod/i.test(userAgent)) {

        window.location.href =
            "instagram://extbrowser/?url=" +
            encodeURIComponent(ageGateUrl);

        return;
    }

    // Android
    if (/Android/i.test(userAgent)) {

        window.location.href =
            "intent://" +
            ageGateUrl.replace(/^https?:\/\//, "") +
            "#Intent;scheme=https;" +
            "package=com.android.chrome;" +
            "S.browser_fallback_url=" +
            encodeURIComponent(ageGateUrl) +
            ";end";

        return;
    }

    // Desktop / otros dispositivos
    window.location.href = ageGateUrl;
});

    ageGateConfirm.addEventListener("click", function () {

    const destination =
        "https://go.meghangomez.com/exclusive";

    const userAgent =
        navigator.userAgent ||
        navigator.vendor ||
        window.opera;

    // iPhone / iPad
    if (/iPhone|iPad|iPod/i.test(userAgent)) {

        const encodedUrl =
            encodeURIComponent(destination);

        window.location.href =
            "instagram://extbrowser/?url=" +
            encodedUrl;

        // Fallback: si Instagram no acepta el deep link,
        // seguimos con el flujo normal.
        setTimeout(function () {
            window.location.href = destination;
        }, 1200);

        return;
    }

    // Android
    if (/Android/i.test(userAgent)) {

        const encodedUrl =
            encodeURIComponent(destination);

        window.location.href =
            "intent://" +
            destination.replace(/^https?:\/\//, "") +
            "#Intent;scheme=https;" +
            "package=com.android.chrome;" +
            "S.browser_fallback_url=" +
            encodedUrl +
            ";end";

        return;
    }

    // Desktop / cualquier otro dispositivo
    window.location.href = destination;
});

    ageGateBack.addEventListener("click", function () {
        ageGate.classList.remove("active");
    });
</script>

</body>
</html>
