
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>Meghan Gomez</title>
    <meta name="description" content="Meghan Gomez — Exclusive Content">

    <style>
        /* RESET */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* BASE */
        html,
        body {
            width: 100%;
            height: 100%;
            background: #080808;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            overflow: hidden;
        }

        /* MAIN PAGE */
        .page {
            position: relative;
            width: 100%;
            height: 100svh;
            min-height: 100svh;
            overflow: hidden;
            background: #080808;
        }

        /* HERO IMAGE */
        .hero-image {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            background-image: url("IMG_5926%203.jpg");
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            transform: scale(1.01);
        }

        /* IMAGE GRADIENT */
        .overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(
                to bottom,
                rgba(0, 0, 0, 0.02) 0%,
                rgba(0, 0, 0, 0.02) 35%,
                rgba(0, 0, 0, 0.10) 55%,
                rgba(0, 0, 0, 0.48) 75%,
                rgba(0, 0, 0, 0.90) 100%
            );
        }

        /* CONTENT */
        .content {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 0 20px calc(24px + env(safe-area-inset-bottom));
        }

        /* IDENTITY */
        .identity {
            width: 100%;
            text-align: center;
            margin-bottom: 22px;
        }

        /* NAME */
        .name {
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(40px, 11vw, 58px);
            line-height: 0.92;
            font-weight: 700;
            letter-spacing: 0.045em;
            text-transform: uppercase;
            color: #ffffff;
            text-shadow:
                0 2px 2px rgba(0, 0, 0, 0.35),
                0 5px 14px rgba(0, 0, 0, 0.55),
                0 10px 28px rgba(0, 0, 0, 0.30);
        }

        /* INSTAGRAM HANDLE */
        .handle {
            margin-top: 12px;
            font-size: 11px;
            font-weight: 400;
            letter-spacing: 0.28em;
            color: rgba(255, 255, 255, 0.80);
            text-transform: uppercase;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.55);
        }

        /* EXCLUSIVE CONTENT BUTTON */
        .exclusive-button {
            position: relative;
            width: 100%;
            height: 58px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 13px;
            border: 1px solid rgba(255, 255, 255, 0.72);
            background: rgba(8, 8, 8, 0.48);
            color: #ffffff;
            text-decoration: none;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.28em;
            text-transform: uppercase;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.28);
            animation: buttonPulse 2s ease-in-out infinite;
            transition:
                background 0.25s ease,
                transform 0.2s ease,
                border-color 0.25s ease;
        }

        /* SUBTLE LIGHT SWEEP */
        .exclusive-button::before {
            content: "";
            position: absolute;
            top: 0;
            left: -70%;
            width: 35%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent 0%,
                rgba(255, 255, 255, 0.04) 25%,
                rgba(255, 255, 255, 0.65) 50%,
                rgba(255, 255, 255, 0.04) 75%,
                transparent 100%
            );
            transform: skewX(-20deg);
            animation: lightSweep 4.5s ease-in-out infinite;
            pointer-events: none;
            z-index: 1;
        }

        @keyframes lightSweep {
            0% { left: -70%; }
            18% { left: 120%; }
            100% { left: 120%; }
        }

        .exclusive-button span {
            position: relative;
            z-index: 2;
        }

        /* BUTTON ANIMATION */
        @keyframes buttonPulse {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-3px); }
        }

        .exclusive-button:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: #ffffff;
        }

        .exclusive-button:active {
            transform: scale(0.985);
        }

        /* LOCK ICON */
        .lock {
            position: relative;
            width: 9px;
            height: 10px;
            display: inline-block;
            flex-shrink: 0;
        }

        .lock::before {
            content: "";
            position: absolute;
            left: 1.5px;
            top: -1px;
            width: 6px;
            height: 6px;
            border: 1.2px solid #ffffff;
            border-bottom: none;
            border-radius: 5px 5px 0 0;
            z-index: 1;
        }

        .lock::after {
            content: "";
            position: absolute;
            left: 0;
            top: 3px;
            width: 9px;
            height: 6px;
            background: rgba(8, 8, 8, 0.96);
            border: 1.2px solid #ffffff;
            border-radius: 1.5px;
            z-index: 2;
        }

        .keyhole {
            position: absolute;
            left: 50%;
            top: 4.5px;
            width: 2px;
            height: 2px;
            transform: translateX(-50%);
            background: #ffffff;
            border-radius: 50%;
            z-index: 3;
        }

        .keyhole::after {
            content: "";
            position: absolute;
            left: 50%;
            top: 1.5px;
            width: 1px;
            height: 2px;
            transform: translateX(-50%);
            background: #ffffff;
        }

        /* FOOTER */
        .footer {
            margin-top: 18px;
            text-align: center;
            font-size: 8px;
            line-height: 1.6;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.42);
            text-shadow: 0 1px 5px rgba(0, 0, 0, 0.5);
        }

        .copyright {
            display: block;
        }

        .website-credit {
            display: block;
            margin-top: 3px;
            font-size: 7px;
            letter-spacing: 0.16em;
            color: rgba(255, 255, 255, 0.27);
        }

        /* SMALL PHONES */
        @media (max-height: 700px) {
            .content {
                padding-bottom: calc(18px + env(safe-area-inset-bottom));
            }

            .identity {
                margin-bottom: 17px;
            }

            .name {
                font-size: 38px;
            }

            .handle {
                margin-top: 8px;
            }

            .exclusive-button {
                height: 54px;
            }

            .footer {
                margin-top: 12px;
            }
        }

        /* DESKTOP PREVIEW */
        @media (min-width: 700px) {
            body {
                display: flex;
                justify-content: center;
                background: #050505;
            }

            .page {
                width: 480px;
                max-width: 480px;
                box-shadow: 0 0 80px rgba(0, 0, 0, 0.65);
            }
        }

        /* FULL-SCREEN AGE GATE */
        .age-gate {
            position: fixed;
            inset: 0;
            z-index: 1000001;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 28px;
            background: #080808;
            color: #ffffff;
            text-align: center;
            font-family: Arial, Helvetica, sans-serif;
        }

        .age-gate-inner {
            width: 100%;
            max-width: 340px;
        }

        .age-gate-brand {
            font-family: Georgia, "Times New Roman", serif;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 0.12em;
            margin-bottom: 28px;
        }

        .age-gate-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 54px;
            height: 54px;
            margin-bottom: 22px;
            border: 1px solid rgba(255, 255, 255, 0.65);
            border-radius: 50%;
            font-size: 17px;
            font-weight: 600;
            letter-spacing: 0.03em;
        }

        .age-gate-title {
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 0.22em;
            margin-bottom: 14px;
        }

        .age-gate-message {
            font-size: 13px;
            line-height: 1.8;
            color: rgba(255, 255, 255, 0.72);
            margin-bottom: 28px;
        }

        .age-gate-button {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            min-height: 52px;
            padding: 15px;
            border: 1px solid #ffffff;
            background: #ffffff;
            color: #080808;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.12em;
            cursor: pointer;
        }

        .age-gate-exit {
            margin-top: 12px;
            background: transparent;
            color: #ffffff;
            border-color: rgba(255, 255, 255, 0.4);
        }

        .age-gate-exit:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .age-gate-note {
            margin-top: 22px;
            font-size: 9px;
            line-height: 1.6;
            letter-spacing: 0.08em;
            color: rgba(255, 255, 255, 0.4);
        }

        /* INSTAGRAM EXTERNAL-BROWSER SCREEN */
        .instagram-blocker {
            position: fixed;
            inset: 0;
            z-index: 1000000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 32px;
            background: #080808;
            color: #ffffff;
            text-align: center;
            font-family: Arial, Helvetica, sans-serif;
        }

        .instagram-blocker-inner {
            width: 100%;
            max-width: 320px;
            line-height: 1.7;
        }

        .instagram-blocker-brand {
            font-family: Georgia, "Times New Roman", serif;
            font-size: 24px;
            letter-spacing: 3px;
            margin-bottom: 24px;
        }

        .instagram-blocker-title {
            font-size: 19px;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .instagram-blocker-message {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 24px;
        }

        .instagram-blocker-button {
            width: 100%;
            min-height: 48px;
            padding: 14px;
            background: rgba(255, 255, 255, 0.08);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.65);
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
        }

        /* DENIED SCREEN */
        .access-denied {
            position: fixed;
            inset: 0;
            z-index: 1000002;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 28px;
            background: #080808;
            color: #ffffff;
            text-align: center;
            font-family: Arial, Helvetica, sans-serif;
        }

        .access-denied-inner {
            width: 100%;
            max-width: 340px;
        }
    </style>
</head>

<body>

    <main class="page" id="mainPage">
        <div class="hero-image"></div>
        <div class="overlay"></div>

        <div class="content">
            <div class="identity">
                <h1 class="name">
                    Meghan<br>
                    Gomez
                </h1>

                <div class="handle">
                    @_meghan_gomez1_
                </div>
            </div>

            <a
                href="https://go.meghangomez.com/exclusive"
                class="exclusive-button"
                id="onlyfansButton"
                aria-label="Exclusive Content"
            >
                <span class="lock">
                    <span class="keyhole"></span>
                </span>
                <span>Exclusive Content</span>
            </a>

            <footer class="footer">

    <!-- CLOUDFLARE WEB ANALYTICS -->
    <script
        defer
        src="https://static.cloudflareinsights.com/beacon.min.js"
        data-cf-beacon='{"token": "540f5a5083054195bcd1905015840e1a"}'>
    </script>
    <!-- END CLOUDFLARE WEB ANALYTICS -->

    <script>
        (() => {
            "use strict";

            const destination =
                "https://go.meghangomez.com/exclusive";

            const userAgent =
                navigator.userAgent ||
                navigator.vendor ||
                window.opera ||
                "";

            const isInstagram = /Instagram/i.test(userAgent);
            const isIOS = /iPhone|iPad|iPod/i.test(userAgent);
            const isAndroid = /Android/i.test(userAgent);

            const ageParam = "age";
            const params = new URLSearchParams(window.location.search);

            /*
             * This parameter carries the user's self-attestation
             * when the page is handed off to an external browser.
             * It is not identity verification and can be edited.
             */
            const ageConfirmedInUrl =
                params.get(ageParam) === "confirmed";

            let ageVerified = ageConfirmedInUrl;
            let accessDenied = false;

            const mainPage = document.getElementById("mainPage");
            const exclusiveButton =
                document.getElementById("onlyfansButton");

            // Keep the landing hidden until the age gate is passed.
            mainPage.style.visibility = "hidden";
            mainPage.setAttribute("aria-hidden", "true");

            function lockPage() {
                document.documentElement.style.overflow = "hidden";
                document.body.style.overflow = "hidden";
            }

            function unlockPage() {
                document.documentElement.style.overflow = "";
                document.body.style.overflow = "";
            }

            function showLanding() {
                if (accessDenied) return;

                mainPage.style.visibility = "visible";
                mainPage.setAttribute("aria-hidden", "false");

                if (exclusiveButton) {
                    exclusiveButton.style.pointerEvents = "";
                    exclusiveButton.setAttribute("aria-disabled", "false");
                }

                unlockPage();
            }

            function buildConfirmedUrl() {
                const confirmedUrl = new URL(window.location.href);
                confirmedUrl.searchParams.set(ageParam, "confirmed");
                return confirmedUrl.href;
            }

            /*
             * Request the Instagram in-app browser to hand off
             * to an external browser. The OS/app may decide whether
             * to allow this request.
             */
            function openExternalBrowser(url) {
                if (isIOS) {
                    window.location.href =
                        "instagram://extbrowser/?url=" +
                        encodeURIComponent(url);
                    return;
                }

                if (isAndroid) {
                    const cleanUrl = url.replace(/^https?:\/\//, "");

                    window.location.href =
                        "intent://" + cleanUrl +
                        "#Intent;scheme=https;" +
                        "package=com.android.chrome;" +
                        "S.browser_fallback_url=" +
                        encodeURIComponent(url) +
                        ";end";
                    return;
                }

                // Fallback for other environments.
                window.location.href = url;
            }

            /*
             * Show a blocking message inside Instagram.
             * This is only created after the visitor confirms
             * they meet the required age.
             */
            function showInstagramBlocker() {
                if (document.querySelector(".instagram-blocker")) return;

                mainPage.style.visibility = "hidden";
                mainPage.setAttribute("aria-hidden", "true");

                const blocker = document.createElement("section");
                blocker.className = "instagram-blocker";
                blocker.setAttribute("role", "dialog");
                blocker.setAttribute("aria-modal", "true");
                blocker.setAttribute("aria-labelledby", "externalTitle");

                blocker.innerHTML = `
                    <div class="instagram-blocker-inner">
                        <div class="instagram-blocker-brand">
                            MEGHAN GOMEZ
                        </div>

                        <h2
                            class="instagram-blocker-title"
                            id="externalTitle"
                        >
                            OPEN IN YOUR BROWSER
                        </h2>

                        <p class="instagram-blocker-message">
                            Your age confirmation was received.
                            To continue, open this website in your
                            external browser.
                        </p>

                        <button
                            id="retryExternal"
                            class="instagram-blocker-button"
                            type="button"
                        >
                            OPEN EXTERNAL BROWSER
                        </button>
                    </div>
                `;

                document.body.appendChild(blocker);
                lockPage();

                document.getElementById("retryExternal")
                    .addEventListener("click", function () {
                        openExternalBrowser(buildConfirmedUrl());
                    });
            }

            /*
             * Show the initial age gate.
             * This is the first visible screen on a fresh visit,
             * including when the link is opened inside Instagram.
             */
            function showAgeGate() {
                const ageGate = document.createElement("section");

                ageGate.className = "age-gate";
                ageGate.setAttribute("role", "dialog");
                ageGate.setAttribute("aria-modal", "true");
                ageGate.setAttribute("aria-labelledby", "ageGateTitle");

                ageGate.innerHTML = `
                    <div class="age-gate-inner">
                        <div class="age-gate-brand">
                            MEGHAN GOMEZ
                        </div>

                        <div class="age-gate-badge">18+</div>

                        <h2
                            class="age-gate-title"
                            id="ageGateTitle"
                        >
                            AGE VERIFICATION
                        </h2>

                        <p class="age-gate-message">
                            This website links to adult content intended
                            exclusively for individuals aged 18 and older.
                            Please confirm that you are at least 18 years
                            old or the age of majority in your jurisdiction,
                            whichever is higher.
                        </p>

                        <button
                            type="button"
                            class="age-gate-button"
                            id="confirmAge"
                        >
                            I AM 18 OR OLDER
                        </button>

                        <button
                            type="button"
                            class="age-gate-button age-gate-exit"
                            id="exitAgeGate"
                        >
                            I AM UNDER 18 / EXIT
                        </button>

                        <p class="age-gate-note">
                            By continuing, you confirm that you meet
                            the applicable minimum age requirement.
                        </p>
                    </div>
                `;

                document.body.appendChild(ageGate);
                lockPage();

                /*
                 * YES: confirm age first, then request external
                 * browser opening if the visitor is in Instagram.
                 */
                document.getElementById("confirmAge")
                    .addEventListener("click", function () {
                        if (accessDenied) return;

                        ageVerified = true;
                        ageGate.remove();

                        if (isInstagram) {
                            showInstagramBlocker();

                            // Request the external browser only now,
                            // after the visitor has confirmed their age.
                            openExternalBrowser(buildConfirmedUrl());
                        } else {
                            // Already in an external/regular browser.
                            showLanding();
                        }
                    });

                /*
                 * NO: deny access. Do not launch the external browser
                 * and do not reveal or link to the landing.
                 */
                document.getElementById("exitAgeGate")
                    .addEventListener("click", function () {
                        accessDenied = true;
                        ageVerified = false;

                        ageGate.remove();
                        mainPage.style.visibility = "hidden";
                        mainPage.setAttribute("aria-hidden", "true");

                        const denied = document.createElement("section");
                        denied.className = "access-denied";
                        denied.setAttribute("role", "dialog");
                        denied.setAttribute("aria-modal", "true");

                        denied.innerHTML = `
                            <div class="access-denied-inner">
                                <div class="age-gate-brand">
                                    MEGHAN GOMEZ
                                </div>

                                <h2 class="age-gate-title">
                                    ACCESS DENIED
                                </h2>

                                <p class="age-gate-message">
                                    You have not confirmed that you meet
                                    the minimum age requirement.
                                    Access is not available.
                                    You may close this page.
                                </p>
                            </div>
                        `;

                        document.body.appendChild(denied);
                        lockPage();
                    });
            }

            /*
             * The Exclusive Content button is inactive until age
             * confirmation. In Instagram it never opens the destination.
             */
            if (exclusiveButton) {
                exclusiveButton.style.pointerEvents = "none";
                exclusiveButton.setAttribute("aria-disabled", "true");

                exclusiveButton.addEventListener("click", function (event) {
                    event.preventDefault();

                    if (!ageVerified || accessDenied || isInstagram) {
                        return;
                    }

                    window.location.href = destination;
                });
            }

            /*
             * FLOW:
             * 1. Fresh visit: show age gate first.
             * 2. Confirmed visit inside Instagram: request external browser.
             * 3. Confirmed visit outside Instagram: show the landing.
             */
            if (!ageVerified) {
                showAgeGate();
            } else if (isInstagram) {
                // A confirmed URL does not reveal the landing inside Instagram.
                showInstagramBlocker();
            } else {
                // The visitor arrived in a regular/external browser
                // with the age confirmation parameter.
                showLanding();
            }
        })();
    </script>

</body>
