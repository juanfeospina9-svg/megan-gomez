<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>18+ Only — Meghan Gomez</title>

    <meta
        name="description"
        content="18+ age confirmation"
    >

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            background: #080808;
        }

        body {
            font-family:
                Arial,
                Helvetica,
                sans-serif;

            color: #ffffff;
        }

        .age-page {

            width: 100%;
            min-height: 100svh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding:
                24px
                20px
                calc(24px + env(safe-area-inset-bottom));

            background: #080808;
        }

        .age-card {

            width: min(100%, 360px);

            padding: 34px 26px 26px;

            text-align: center;

            background: rgba(18, 18, 18, 0.96);

            border:
                1px solid
                rgba(255, 255, 255, 0.12);

            box-shadow:
                0 24px 70px
                rgba(0, 0, 0, 0.55);
        }

        .age-title {

            margin-bottom: 14px;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: 25px;

            font-weight: 700;

            letter-spacing: 0.12em;

            color: #ffffff;
        }

        .age-text {

            margin-bottom: 28px;

            font-size: 12px;

            line-height: 1.7;

            letter-spacing: 0.02em;

            color:
                rgba(255, 255, 255, 0.68);
        }

        .age-actions {

            display: flex;

            flex-direction: column;

            gap: 10px;
        }

        .age-confirm,
        .age-back {

            width: 100%;

            min-height: 46px;

            border:
                1px solid
                rgba(255, 255, 255, 0.18);

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            font-size: 11px;

            font-weight: 700;

            letter-spacing: 0.14em;

            cursor: pointer;

            transition:
                background 0.2s ease,
                border-color 0.2s ease,
                transform 0.15s ease;
        }

        .age-confirm {

            background:
                rgba(255, 255, 255, 0.94);

            color: #080808;
        }

        .age-back {

            background: transparent;

            color:
                rgba(255, 255, 255, 0.68);
        }

        .age-confirm:active,
        .age-back:active {

            transform: scale(0.985);
        }

        .age-confirm:hover {

            background: #ffffff;

            border-color: #ffffff;
        }

        .age-back:hover {

            border-color:
                rgba(255, 255, 255, 0.45);

            color: #ffffff;
        }

        .age-footer {

            margin-top: 22px;

            font-size: 8px;

            letter-spacing: 0.16em;

            text-transform: uppercase;

            color:
                rgba(255, 255, 255, 0.28);
        }

    </style>

</head>

<body>

    <main class="age-page">

        <section class="age-card">

            <div class="age-title">
                18+ ONLY
            </div>

            <div class="age-text">
                This content is intended for adults
                18 years and older.
            </div>

            <div class="age-actions">

                <button
                    class="age-confirm"
                    id="ageConfirm"
                >
                    I'M 18+
                </button>

                <button
                    class="age-back"
                    id="ageBack"
                >
                    GO BACK
                </button>

            </div>

            <div class="age-footer">
                MeghanGomez.com
            </div>

        </section>

    </main>

    <script>

        const destination =
            "https://go.meghangomez.com/exclusive";

        const ageConfirm =
            document.getElementById("ageConfirm");

        const ageBack =
            document.getElementById("ageBack");

        ageConfirm.addEventListener(
            "click",
            function () {

                window.location.href =
                    destination;

            }
        );

        ageBack.addEventListener(
            "click",
            function () {

                window.history.back();

            }
        );

    </script>

</body>
</html>
